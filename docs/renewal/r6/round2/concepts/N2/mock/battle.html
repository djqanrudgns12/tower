<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>N2 Battle - 크리처 펫 진화 대전</title>
<link rel="stylesheet" href="n2-theme.css">
<style>
  .hud-top {
    position: absolute; top: 14px; left: 18px; right: 18px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  .hud-group { display: flex; align-items: center; gap: 10px; }
  .hp-bar-track {
    width: 88px; height: 12px; border-radius: 999px;
    background: #E2E8F0; border: 2px solid var(--ink); overflow: hidden;
  }
  .hp-bar-fill {
    width: 88%; height: 100%;
    background: linear-gradient(90deg, #FF4D8D, #FF73A8);
  }
  .hud-val {
    font-family: 'Cafe24Ssurround', sans-serif;
    font-size: 18px; color: var(--ink);
  }
  .hud-sub { font-size: 13px; color: #475569; margin-left: 2px; }

  .pause-btn {
    width: 44px; height: 44px; border-radius: 14px; padding: 0;
  }

  /* 하단 좌측~중앙: 부채꼴 트레이딩 카드 덱 소환 슬롯 4장 */
  .bottom-arena {
    position: absolute; left: 18px; right: 18px; bottom: 14px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
    z-index: 12;
  }
  .deck-dock {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 14px 10px;
    border-radius: 24px;
    background: rgba(19, 27, 66, 0.58);
    backdrop-filter: blur(8px);
    border: 3px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 8px 24px rgba(19, 27, 66, 0.4);
  }
  .pet-card {
    width: 124px; height: 164px; cursor: pointer;
    transition: transform 0.15s;
  }
  .pet-card.rot-l2 { transform: rotate(-2.5deg) translateY(3px); }
  .pet-card.rot-l1 { transform: rotate(-0.8deg); }
  .pet-card.selected {
    transform: translateY(-14px) scale(1.06);
    box-shadow: 0 0 0 3px #FFE033, 0 10px 0 var(--ink), 0 0 26px rgba(255, 224, 51, 0.9);
    z-index: 4;
  }
  .pet-card.rot-r1 { transform: rotate(1.5deg) translateY(2px); }

  .pet-card .tcg-inner { padding: 4px; background: #FFFDF8; justify-content: space-between; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px;
  }
  .cost-gem {
    padding: 1px 6px; border-radius: 999px; border: 2px solid var(--ink);
    background: #FFE033; font-family: 'Cafe24Ssurround', sans-serif; font-size: 11px; color: var(--ink);
  }
  .card-stars { font-size: 10px; color: #F59E0B; letter-spacing: -1px; }
  .card-art {
    width: 100%; height: 78px; border-radius: 8px;
    border: 2px solid var(--ink); overflow: hidden; background: #E0F2FE;
  }
  .card-art img { width: 100%; height: 100%; object-fit: cover; }
  .card-name {
    font-family: 'Cafe24Ssurround', sans-serif; font-size: 11.5px; white-space: nowrap;
    text-align: center; color: var(--ink); line-height: 1.15; margin-top: 2px;
  }
  .card-foot {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 10px; color: #475569;
  }

  /* 하단 우측: 속성 퀴즈 패널 (4지선다 + 모르겠어요) */
  .quiz-panel {
    flex: 1;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(239,248,255,0.97) 100%);
    border: 4px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink), 0 14px 30px rgba(19, 27, 66, 0.35);
    padding: 12px 16px 14px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .combo-meter {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px;
    background: #FEF3C7; border: 2.5px solid var(--ink);
    font-size: 13px; color: var(--ink);
  }
  .combo-stars { color: #F59E0B; font-size: 15px; letter-spacing: 1px; }
  .timer-pill {
    width: 110px; height: 14px; border-radius: 999px;
    background: #E2E8F0; border: 2.5px solid var(--ink); overflow: hidden;
  }
  .timer-fill {
    width: 72%; height: 100%;
    background: linear-gradient(90deg, #2CE6A8, #38BDF8);
  }

  .quiz-prompt {
    background: #FFFFFF;
    border: 3px solid #CBD5E1;
    border-radius: 16px;
    padding: 9px 14px;
    font-size: 18px; line-height: 1.3; color: var(--ink);
  }
  .blank-slot {
    display: inline-block; padding: 0 12px; margin: 0 3px;
    border-radius: 10px; background: #FEF08A; border: 2.5px dashed #EA580C;
    font-family: 'Cafe24Ssurround', sans-serif; color: #EA580C;
  }

  .quiz-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1.05fr;
    gap: 8px;
    align-items: stretch;
  }
  .choice-btn {
    border: 3px solid var(--ink);
    border-radius: 15px;
    padding: 9px 8px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
    box-shadow: inset 0 -3px 0 #CBD5E1, 0 4px 0 var(--ink);
    font-family: 'Jua', sans-serif; font-size: 17px; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .choice-btn.hint-focus {
    background: linear-gradient(180deg, #FFF7CC 0%, #FFE066 100%);
    box-shadow: inset 0 -3px 0 #F59E0B, 0 4px 0 var(--ink);
  }
  .choice-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: #FFF; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .idk-btn {
    border: 3px solid var(--ink);
    border-radius: 15px;
    padding: 9px 8px;
    background: linear-gradient(180deg, #EDE9FE 0%, #DDD6FE 100%);
    box-shadow: inset 0 -3px 0 #C4B5FD, 0 4px 0 var(--ink);
    font-family: 'Jua', sans-serif; font-size: 15px; color: #4C1D95;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
</style>
</head>
<body>
<div class="stage">
  <img class="bg-art" src="assets/a-battle-bg.webp" alt="전투 배경">

  <!-- 상단 크리스털 보석 캡슐 HUD (배속 UI 없음) -->
  <header class="hud-top">
    <div class="hud-group">
      <div class="gem-capsule">
        <svg width="24" height="24" viewBox="0 0 28 28"><path d="M14,25 L4,15 C1,11 2,5 7,4 C10,3.5 13,5.5 14,8 C15,5.5 18,3.5 21,4 C26,5 27,11 24,15 Z" fill="#FF4D8D" stroke="#131B42" stroke-width="2.5"/><path d="M8,8 C9.5,7 11,8 11,9.5" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <div class="hp-bar-track"><div class="hp-bar-fill"></div></div>
        <span class="hud-val">18<span class="hud-sub">/20</span></span>
      </div>

      <div class="gem-capsule">
        <svg width="24" height="24" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="#FFE033" stroke="#131B42" stroke-width="2.5"/><polygon points="14,6 16.5,11 22,11.5 18,15.5 19,21 14,18 9,21 10,15.5 6,11.5 11.5,11" fill="#FFF7AE" stroke="#131B42" stroke-width="1.5"/></svg>
        <span class="hud-val">320G</span>
      </div>

      <div class="gem-capsule">
        <svg width="22" height="22" viewBox="0 0 28 28"><polygon points="14,2 25,10 21,25 7,25 3,10" fill="#38BDF8" stroke="#131B42" stroke-width="2.5"/></svg>
        <span class="hud-val">WAVE 3<span class="hud-sub">/8</span></span>
      </div>

      <div class="gem-capsule">
        <span class="hud-val" style="font-size:15px;">남은 적 <b>11</b></span>
      </div>
    </div>

    <div class="hud-group">
      <div class="gem-capsule" style="background:linear-gradient(180deg,#FFFBEB,#FEF08A);">
        <span class="hud-val" style="font-size:16px;color:#D97706;">🔥 4연속 콤보</span>
      </div>
      <button class="jelly-btn jelly-frost pause-btn" aria-label="일시정지">
        <svg width="18" height="18" viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#FFF" stroke="#131B42" stroke-width="1.8"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#FFF" stroke="#131B42" stroke-width="1.8"/></svg>
      </button>
    </div>
  </header>

  <!-- 하단: 좌측 펫 카드 덱(4장) + 우측 속성 퀴즈 패널(4지선다 + 모르겠어요) -->
  <section class="bottom-arena">
    <div class="deck-dock">
      <div class="tcg-card rarity-rare pet-card selected">
        <div class="tcg-inner">
          <div class="card-head"><span class="cost-gem">80G</span><span class="card-stars">★★</span></div>
          <div class="card-art"><img src="assets/pet-chick.webp" alt="햇살병아리"></div>
          <div class="card-name">햇살병아리</div>
          <div class="card-foot"><span class="type-pill type-sun">빛</span><span>공속 빠름</span></div>
        </div>
      </div>

      <div class="tcg-card rarity-epic pet-card rot-l1">
        <div class="tcg-inner">
          <div class="card-head"><span class="cost-gem">110G</span><span class="card-stars">★★★</span></div>
          <div class="card-art"><img src="assets/pet-turtle.webp" alt="베리거북"></div>
          <div class="card-name">베리거북</div>
          <div class="card-foot"><span class="type-pill type-berry">폭발</span><span>범위 포격</span></div>
        </div>
      </div>

      <div class="tcg-card rarity-rare pet-card rot-l2">
        <div class="tcg-inner">
          <div class="card-head"><span class="cost-gem">100G</span><span class="card-stars">★★</span></div>
          <div class="card-art"><img src="assets/pet-narwhal.webp" alt="서리일각고래"></div>
          <div class="card-name">서리일각고래</div>
          <div class="card-foot"><span class="type-pill type-frost">서리</span><span>빙결 감속</span></div>
        </div>
      </div>

      <div class="tcg-card rarity-legend pet-card rot-r1">
        <div class="tcg-inner">
          <div class="card-head"><span class="cost-gem">140G</span><span class="card-stars">★★★★</span></div>
          <div class="card-art"><img src="assets/pet-axolotl.webp" alt="은하아홀로틀"></div>
          <div class="card-name">은하아홀로틀</div>
          <div class="card-foot"><span class="type-pill type-galaxy">은하</span><span>별빛 연쇄</span></div>
        </div>
      </div>
    </div>

    <div class="quiz-panel">
      <div class="quiz-top">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="type-pill type-sun" style="font-size:13px;padding:3px 10px;">☀ 5학년 빛 속성 퀴즈</span>
          <span style="font-size:13px;color:#64748B;">정답 시 햇살병아리 소환 +45G!</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="combo-meter">
            <span class="combo-stars">★★★★☆</span>
            <span><b>4/5</b> 궁극기</span>
          </div>
          <div class="timer-pill"><div class="timer-fill"></div></div>
        </div>
      </div>

      <div class="quiz-prompt">
        모둠 친구들과 힘을 <span class="blank-slot">?</span> 어려운 수학 문제를 멋지게 해결했다.
      </div>

      <div class="quiz-grid">
        <button class="choice-btn hint-focus"><span class="choice-num">1</span>합쳐</button>
        <button class="choice-btn"><span class="choice-num">2</span>흩어</button>
        <button class="choice-btn"><span class="choice-num">3</span>숨겨</button>
        <button class="choice-btn"><span class="choice-num">4</span>나눠</button>
        <button class="idk-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9,18 L15,18 L14,21 L10,21 Z M12,2 C7.5,2 4.5,5.5 5,10 C5.3,12.5 7,14 8,16 L16,16 C17,14 18.7,12.5 19,10 C19.5,5.5 16.5,2 12,2 Z" fill="#FACC15" stroke="#131B42" stroke-width="2" stroke-linejoin="round"/></svg>
          모르겠어요
        </button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
