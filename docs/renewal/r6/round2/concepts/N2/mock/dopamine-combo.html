<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>N2 Dopamine Combo - 5연속 하모니 크리티컬!</title>
<link rel="stylesheet" href="n2-theme.css">
<style>
  .combo-stage {
    background: #0F172A;
  }
  .combo-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 45%;
    transform: scale(1.08);
    filter: blur(5px) saturate(1.24) brightness(0.9);
    pointer-events: none;
  }
  /* 강렬한 방사형 프리즘 폭발 배경 오버레이 (중앙 배경 캐릭터 블러 + 화려한 폭발 오라) */
  .prism-burst {
    position: absolute; inset: -25%;
    background:
      radial-gradient(circle at 50% 53%,
        rgba(255,255,255,0.96) 0%,
        rgba(255,245,157,0.88) 12%,
        rgba(255,107,232,0.56) 26%,
        rgba(56,189,248,0.34) 44%,
        rgba(19,27,66,0.22) 72%,
        rgba(19,27,66,0.5) 100%
      ),
      repeating-conic-gradient(
        from 0deg at 50% 53%,
        rgba(255, 255, 255, 0.34) 0deg 7deg,
        rgba(255, 224, 51, 0.16) 7deg 14deg,
        rgba(255, 77, 141, 0.18) 14deg 21deg,
        rgba(58, 226, 255, 0.18) 21deg 28deg,
        rgba(168, 85, 247, 0.18) 28deg 35deg
      );
    pointer-events: none;
    z-index: 1;
  }
  .vignette-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 52%, transparent 32%, rgba(19, 27, 66, 0.42) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* 상단 홀로그램 배너 */
  .combo-banner-wrap {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 20; width: 920px;
  }
  .holo-ribbon {
    position: relative;
    padding: 11px 44px;
    border-radius: 28px;
    border: 4.5px solid var(--ink);
    background: var(--holo-grad);
    box-shadow:
      inset 0 6px 0 rgba(255,255,255,0.78),
      0 8px 0 var(--ink),
      0 0 44px rgba(255, 224, 51, 0.95);
    text-align: center;
  }
  .holo-ribbon-text {
    font-size: 44px; color: #FFFFFF;
    -webkit-text-stroke: 7px var(--ink);
    filter: drop-shadow(0 5px 0 var(--ink));
  }
  .combo-sub {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 5px 18px; border-radius: 999px;
    background: rgba(255,255,255,0.95); border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink); font-size: 15.5px;
  }

  /* 4방향 에너지 빔 SVG 레이어 */
  .beams-svg {
    position: absolute; inset: 0; width: 1280px; height: 720px;
    z-index: 5; pointer-events: none;
  }

  /* 중앙 거대 황금-무지개 하모니 별 코어 */
  .star-core-wrap {
    position: absolute;
    left: 50%; top: 53%;
    transform: translate(-50%, -50%);
    width: 340px; height: 340px;
    display: flex; align-items: center; justify-content: center;
    z-index: 12;
  }
  .shockwave-outer {
    position: absolute; inset: 4px; border-radius: 50%;
    border: 5px solid rgba(255, 255, 255, 0.88);
    box-shadow:
      0 0 42px rgba(255, 224, 51, 0.95),
      inset 0 0 36px rgba(58, 226, 255, 0.85);
    background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,224,51,0.22) 55%, transparent 72%);
  }
  .shockwave-holo {
    position: absolute; inset: 28px; border-radius: 50%;
    padding: 6px;
    background: conic-gradient(#FF5E7E, #FFE033, #4EF09D, #3AE2FF, #A855F7, #FF6BE8, #FF5E7E);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    opacity: 0.92;
  }
  .core-svg {
    position: relative; z-index: 3;
    width: 268px; height: 268px;
    filter: drop-shadow(0 0 26px rgba(255, 224, 51, 0.95)) drop-shadow(0 6px 0 rgba(19,27,66,0.45));
  }
  .core-badge {
    position: absolute; z-index: 5;
    padding: 5px 16px; border-radius: 999px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FEF08A 100%);
    border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink), 0 0 22px rgba(255,255,255,0.95);
    font-family: 'Cafe24Ssurround', sans-serif;
    font-size: 19px; color: #E11D62;
    letter-spacing: 0.02em;
    transform: translateY(2px);
  }

  /* 4마리 펫 둥근 홀로그램 포일 원형 메달 */
  .pet-medal {
    position: absolute; z-index: 15;
    display: flex; flex-direction: column; align-items: center;
  }
  .pet-ring {
    width: 196px; height: 196px;
    border-radius: 50%;
    padding: 7px;
    border: 4px solid var(--ink);
    background: conic-gradient(#FF6482, #FFE047, #4FF2A1, #3AE2FF, #A66BFF, #FF6BE8, #FF6482);
    box-shadow:
      0 8px 0 var(--ink),
      0 0 32px rgba(255, 255, 255, 0.85);
    position: relative;
  }
  /* 홀로 포일 대각선 광택 */
  .pet-ring::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(125deg, rgba(255,255,255,0.6) 8%, transparent 32%, transparent 65%, rgba(255,255,255,0.45) 88%);
    pointer-events: none; z-index: 4;
  }
  .pet-crop {
    width: 100%; height: 100%;
    border-radius: 50%; overflow: hidden;
    border: 3px solid var(--ink);
    position: relative;
    background: #FFFDF7;
  }
  .pet-crop img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* 메달 가장자리 속성 오라 비네트 */
  .pet-crop::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  }
  .aura-sun .pet-crop::after {
    background: radial-gradient(circle, transparent 52%, rgba(255, 184, 0, 0.42) 86%, rgba(255, 107, 0, 0.78) 100%);
  }
  .aura-sun .pet-ring { box-shadow: 0 8px 0 var(--ink), 0 0 36px rgba(255, 184, 0, 0.95); }

  .aura-berry .pet-crop::after {
    background: radial-gradient(circle, transparent 52%, rgba(255, 77, 141, 0.42) 86%, rgba(225, 29, 98, 0.78) 100%);
  }
  .aura-berry .pet-ring { box-shadow: 0 8px 0 var(--ink), 0 0 36px rgba(255, 77, 141, 0.95); }

  .aura-frost .pet-crop::after {
    background: radial-gradient(circle, transparent 52%, rgba(0, 210, 255, 0.42) 86%, rgba(37, 99, 235, 0.78) 100%);
  }
  .aura-frost .pet-ring { box-shadow: 0 8px 0 var(--ink), 0 0 36px rgba(0, 210, 255, 0.95); }

  .aura-galaxy .pet-crop::after {
    background: radial-gradient(circle, transparent 52%, rgba(168, 85, 247, 0.45) 86%, rgba(109, 40, 217, 0.82) 100%);
  }
  .aura-galaxy .pet-ring { box-shadow: 0 8px 0 var(--ink), 0 0 36px rgba(168, 85, 247, 0.95); }

  .pet-tag {
    margin-top: -18px; position: relative; z-index: 6;
    padding: 4px 14px; border-radius: 999px;
    border: 3px solid var(--ink);
    font-family: 'Cafe24Ssurround', sans-serif; font-size: 14px; color: #FFFFFF;
    paint-order: stroke fill; -webkit-text-stroke: 2.5px var(--ink);
    box-shadow: 0 3px 0 var(--ink);
  }

  /* 흩날리는 별빛 & 무지개 파편 */
  .sparkle-layer {
    position: absolute; inset: 0; z-index: 11; pointer-events: none;
  }
  .star-4 {
    position: absolute;
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  }
  .shard {
    position: absolute;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 0 var(--ink);
  }

  .bottom-bonus {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 20;
  }
</style>
</head>
<body>
<div class="stage combo-stage">
  <!-- 배경: 화사한 무지개 초원 + 방사형 프리즘 폭발 -->
  <img class="combo-bg" src="assets/b-home-bg.webp" alt="하모니 원더랜드 배경">
  <div class="prism-burst"></div>
  <div class="vignette-overlay"></div>

  <!-- 4방향 속성 에너지 빔 (메달 중심 -> 중앙 별 코어 640,382) -->
  <svg class="beams-svg" viewBox="0 0 1280 720">
    <defs>
      <filter id="beamGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="beamSun" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFB800"/><stop offset="100%" stop-color="#FFF7AE"/>
      </linearGradient>
      <linearGradient id="beamBerry" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF4D8D"/><stop offset="100%" stop-color="#FFE4F1"/>
      </linearGradient>
      <linearGradient id="beamFrost" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#E0F7FF"/>
      </linearGradient>
      <linearGradient id="beamGalaxy" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#F3E8FF"/>
      </linearGradient>
    </defs>

    <!-- 태양 빔 (좌상 238,242 -> 중앙 640,382) -->
    <g filter="url(#beamGlow)">
      <polygon points="215,212 262,272 652,402 628,362" fill="url(#beamSun)" stroke="#131B42" stroke-width="4" stroke-linejoin="round"/>
      <line x1="238" y1="242" x2="640" y2="382" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 베리 빔 (좌하 238,510 -> 중앙 640,382) -->
    <g filter="url(#beamGlow)">
      <polygon points="215,540 262,480 652,362 628,402" fill="url(#beamBerry)" stroke="#131B42" stroke-width="4" stroke-linejoin="round"/>
      <line x1="238" y1="510" x2="640" y2="382" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 서리 빔 (우상 1042,242 -> 중앙 640,382) -->
    <g filter="url(#beamGlow)">
      <polygon points="1065,212 1018,272 628,402 652,362" fill="url(#beamFrost)" stroke="#131B42" stroke-width="4" stroke-linejoin="round"/>
      <line x1="1042" y1="242" x2="640" y2="382" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 은하 빔 (우하 1042,510 -> 중앙 640,382) -->
    <g filter="url(#beamGlow)">
      <polygon points="1065,540 1018,480 628,362 652,402" fill="url(#beamGalaxy)" stroke="#131B42" stroke-width="4" stroke-linejoin="round"/>
      <line x1="1042" y1="510" x2="640" y2="382" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- 흩날리는 별빛 & 무지개 파편 -->
  <div class="sparkle-layer">
    <div class="star-4" style="left:415px;top:170px;width:44px;height:44px;background:#FFE033;"></div>
    <div class="star-4" style="left:820px;top:178px;width:40px;height:40px;background:#3AE2FF;"></div>
    <div class="star-4" style="left:418px;top:525px;width:36px;height:36px;background:#FF4D8D;"></div>
    <div class="star-4" style="left:828px;top:520px;width:42px;height:42px;background:#A855F7;"></div>
    <div class="star-4" style="left:348px;top:365px;width:28px;height:28px;background:#FFFFFF;"></div>
    <div class="star-4" style="left:900px;top:362px;width:30px;height:30px;background:#FFFFFF;"></div>
    <div class="star-4" style="left:510px;top:240px;width:22px;height:22px;background:#FFF;"></div>
    <div class="star-4" style="left:745px;top:248px;width:24px;height:24px;background:#FFE033;"></div>
    <div class="star-4" style="left:518px;top:495px;width:24px;height:24px;background:#4EF09D;"></div>
    <div class="star-4" style="left:742px;top:492px;width:22px;height:22px;background:#FF6BE8;"></div>

    <!-- 무지개 프리즘 파편 -->
    <div class="shard" style="left:385px;top:248px;width:18px;height:18px;background:#FFE033;transform:rotate(24deg);border-radius:4px;"></div>
    <div class="shard" style="left:875px;top:255px;width:16px;height:16px;background:#3AE2FF;transform:rotate(-18deg);border-radius:4px;"></div>
    <div class="shard" style="left:388px;top:468px;width:18px;height:18px;background:#FF4D8D;transform:rotate(-28deg);border-radius:4px;"></div>
    <div class="shard" style="left:872px;top:470px;width:18px;height:18px;background:#C084FC;transform:rotate(32deg);border-radius:4px;"></div>
    <div class="shard" style="left:455px;top:315px;width:12px;height:24px;background:#4EF09D;transform:rotate(42deg);border-radius:6px;"></div>
    <div class="shard" style="left:805px;top:318px;width:12px;height:24px;background:#FFB800;transform:rotate(-42deg);border-radius:6px;"></div>
  </div>

  <!-- 중앙 거대 황금-무지개 하모니 별 코어 -->
  <div class="star-core-wrap">
    <div class="shockwave-outer"></div>
    <div class="shockwave-holo"></div>
    <svg class="core-svg" viewBox="0 0 260 260">
      <defs>
        <linearGradient id="starPrism" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF59D"/>
          <stop offset="28%" stop-color="#FFE033"/>
          <stop offset="56%" stop-color="#FF6BE8"/>
          <stop offset="80%" stop-color="#3AE2FF"/>
          <stop offset="100%" stop-color="#4EF09D"/>
        </linearGradient>
        <linearGradient id="starInner" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="45%" stop-color="#FEF08A"/>
          <stop offset="100%" stop-color="#FF9F1C"/>
        </linearGradient>
      </defs>
      <!-- 후면 4각 프리즘 광선 -->
      <polygon points="130,4 156,104 256,130 156,156 130,256 104,156 4,130 104,104"
               fill="url(#starPrism)" stroke="#131B42" stroke-width="6" stroke-linejoin="round"/>
      <!-- 전면 황금 5각 별 -->
      <polygon points="130,26 158,92 228,98 174,144 190,214 130,176 70,214 86,144 32,98 102,92"
               fill="url(#starInner)" stroke="#131B42" stroke-width="6" stroke-linejoin="round"/>
      <!-- 코어 백색 하이라이트 -->
      <circle cx="130" cy="130" r="36" fill="#FFFFFF" opacity="0.92"/>
    </svg>
    <div class="core-badge">★ HARMONY x5</div>
  </div>

  <!-- 4마리 펫 둥근 홀로그램 포일 원형 메달 (발판/흙길 제외 타이트 크롭) -->
  <!-- 좌상: 태양 병아리 -->
  <div class="pet-medal aura-sun" style="left: 140px; top: 144px;">
    <div class="pet-ring">
      <div class="pet-crop">
        <img src="assets/pet-chick.webp" alt="태양 병아리"
             style="transform-origin: 67% 57%; transform: scale(1.66);" />
      </div>
    </div>
    <span class="pet-tag type-sun">☀ 태양 병아리</span>
  </div>

  <!-- 좌하: 베리 거북 -->
  <div class="pet-medal aura-berry" style="left: 140px; top: 412px;">
    <div class="pet-ring">
      <div class="pet-crop">
        <img src="assets/pet-turtle.webp" alt="베리 거북"
             style="transform-origin: 39% 60%; transform: scale(1.66);" />
      </div>
    </div>
    <span class="pet-tag type-berry">🍓 베리 대포거북</span>
  </div>

  <!-- 우상: 서리 일각고래 -->
  <div class="pet-medal aura-frost" style="right: 140px; top: 144px;">
    <div class="pet-ring">
      <div class="pet-crop">
        <img src="assets/pet-narwhal.webp" alt="서리 고래"
             style="transform-origin: 48% 66%; transform: scale(1.66);" />
      </div>
    </div>
    <span class="pet-tag type-frost">❄ 서리 일각고래</span>
  </div>

  <!-- 우하: 은하 우파루파 -->
  <div class="pet-medal aura-galaxy" style="right: 140px; top: 412px;">
    <div class="pet-ring">
      <div class="pet-crop">
        <img src="assets/pet-axolotl.webp" alt="은하 우파루파"
             style="transform-origin: 32% 58%; transform: scale(1.68);" />
      </div>
    </div>
    <span class="pet-tag type-galaxy">🌌 은하 우파루파</span>
  </div>

  <!-- 상단 타이틀 & 속성 조합 바 -->
  <div class="combo-banner-wrap">
    <div class="holo-ribbon">
      <div class="title-stroke holo-ribbon-text">5연속 하모니 크리티컬! +45G</div>
    </div>
    <div class="combo-sub">
      <span class="type-pill type-sun">☀ 태양</span>
      <span class="type-pill type-berry">🍓 베리</span>
      <span class="type-pill type-frost">❄ 서리</span>
      <span class="type-pill type-galaxy">🌌 은하</span>
      <span><b>4속성 펫 전원 합동 필살기 발동!</b></span>
    </div>
  </div>

  <!-- 하단 보상 캡슐 -->
  <div class="bottom-bonus">
    <div class="gem-capsule" style="padding:8px 20px;">
      <span style="font-family:'Cafe24Ssurround',sans-serif;font-size:18px;color:#E11D62;">💥 적 무리 일망타진!</span>
    </div>
    <div class="gem-capsule" style="padding:8px 20px;background:linear-gradient(180deg,#FEF9C3,#FDE047);">
      <span style="font-family:'Cafe24Ssurround',sans-serif;font-size:18px;">✨ 다음 소환 골드 30% 할인</span>
    </div>
  </div>
</div>
</body>
</html>
