<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>N1 도파민 콤보 폭발 · 툰 3D 브롤 아레나</title>
  <link rel="stylesheet" href="n1-shared.css" />
  <style>
    .combo-stage {
      background:
        radial-gradient(circle at 50% 53%, rgba(255, 214, 10, 0.48) 0%, rgba(29, 78, 216, 0.55) 38%, #09102A 78%),
        #070B1E;
    }

    /* Fullscreen SVG Speed Lines + Radial Gold Glow */
    .fx-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Central Arcade Holo Spotlight Cutout Frame */
    .hero-spotlight-wrap {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 390px;
      height: 390px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .holo-outer-ring {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #FFD60A, #00E5FF, #FF4D8D, #22C55E, #FFD60A);
      padding: 6px;
      box-shadow:
        0 0 55px rgba(255, 214, 10, 0.85),
        0 0 95px rgba(0, 229, 255, 0.55),
        0 10px 0 #070B1E;
      outline: 5px solid #070B1E;
    }
    .holo-inner-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #09102A;
      border: 4px solid #FFFBEB;
      outline: 4px solid #070B1E;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0, 229, 255, 0.55);
    }
    /* Exact crop of Lv.7 Starlight Hero from c-tower-evo.webp (right side) */
    .lv7-hero-crop {
      position: absolute;
      width: 1020px;
      height: 574px;
      left: -620px;
      top: -22px;
      max-width: none;
      pointer-events: none;
    }
    .spotlight-badge {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%) skewX(-8deg);
      padding: 5px 18px;
      background: linear-gradient(135deg, #FF4D8D, #FFD60A);
      border: 3px solid #FFFBEB;
      outline: 3.5px solid #070B1E;
      border-radius: 99px;
      font-family: 'SBAggroB', sans-serif;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 4px 0 #070B1E;
      z-index: 15;
    }

    /* Dynamic Coins Layer */
    .coins-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 18;
    }
    .coin-item {
      position: absolute;
      filter: drop-shadow(0 5px 0 rgba(7, 11, 30, 0.9)) drop-shadow(0 0 12px rgba(255, 214, 10, 0.65));
    }

    .combo-banner-wrap {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      text-align: center;
      z-index: 25;
      width: 980px;
    }
    .combo-main-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 74px;
      line-height: 1;
      color: #FFE44D;
      paint-order: stroke fill;
      -webkit-text-stroke: 10px #070B1E;
      text-shadow: 0 8px 0 #070B1E;
      filter: drop-shadow(0 0 28px rgba(255, 214, 10, 0.85));
    }
    .fever-bar-wrap {
      margin: 8px auto 0;
      width: 520px;
      padding: 6px 10px;
      background: #09102A;
      border: 3.5px solid #FFD60A;
      outline: 3.5px solid #070B1E;
      border-radius: 99px;
      transform: skewX(-6deg);
      box-shadow: 0 5px 0 #070B1E;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fever-track {
      flex: 1;
      height: 22px;
      background: #172554;
      border-radius: 99px;
      border: 2px solid #070B1E;
      overflow: hidden;
      position: relative;
    }
    .fever-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10B981, #34D399, #FFD60A);
      box-shadow: inset 0 3px 0 rgba(255,255,255,0.6);
    }

    /* Floating Battle Critical Banners */
    .crit-chip {
      position: absolute;
      padding: 11px 22px;
      border-radius: 16px;
      outline: 3.5px solid #070B1E;
      box-shadow: 0 6px 0 #070B1E, 0 0 20px rgba(255, 214, 10, 0.35);
      z-index: 25;
    }
    .crit-left {
      left: 38px;
      bottom: 84px;
      background: linear-gradient(180deg, #34D399 0%, #059669 100%);
      border: 3.5px solid #D1FAE5;
      transform: skewX(-8deg) rotate(-5deg);
    }
    .crit-right {
      right: 38px;
      bottom: 84px;
      background: linear-gradient(180deg, #FFE44D 0%, #F59E0B 100%);
      border: 3.5px solid #FFFBEB;
      transform: skewX(-8deg) rotate(4deg);
    }
    .bottom-toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) skewX(-6deg);
      padding: 9px 28px;
      background: linear-gradient(90deg, #0E173B, #1D4ED8, #0E173B);
      border: 3px solid #00E5FF;
      outline: 3px solid #070B1E;
      border-radius: 99px;
      box-shadow: 0 5px 0 #070B1E;
      font-family: 'SBAggroB', sans-serif;
      font-size: 19px;
      z-index: 25;
      white-space: nowrap;
    }
  </style>
</head>
