<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>N1 홈 로비 · 툰 3D 브롤 아레나</title>
  <link rel="stylesheet" href="n1-shared.css" />
  <style>
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .profile-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 6px 8px;
      background: linear-gradient(180deg, #1E327B 0%, #0E173B 100%);
      border: 3px solid #00E5FF;
      outline: 3px solid #070B1E;
      border-radius: 14px;
      transform: skewX(-6deg);
      box-shadow: 0 5px 0 #070B1E;
    }
    .profile-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      transform: skewX(6deg);
    }
    .avatar-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(180deg, #FFE44D, #F59E0B);
      border: 2.5px solid #070B1E;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .res-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .res-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #0E173B;
      border: 3px solid #FFD60A;
      outline: 3px solid #070B1E;
      border-radius: 12px;
      transform: skewX(-6deg);
      box-shadow: 0 4px 0 #070B1E;
    }
    .res-pill.gem { border-color: #C084FC; }

    /* Left Floating 3D Menu */
    .left-menu {
      position: absolute;
      left: 20px;
      top: 118px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 20;
    }
    .menu-btn {
      width: 148px;
      padding: 10px 14px;
      justify-content: flex-start;
      transform: skewX(-6deg);
      border-radius: 14px;
    }
    .menu-btn .unskew {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .menu-title {
      font-family: 'SBAggroB', sans-serif;
      font-size: 16px;
      line-height: 1.1;
    }
    .menu-sub {
      font-family: 'Jua', sans-serif;
      font-size: 12px;
      color: #BAE6FD;
    }
    .notif-dot {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 99px;
      background: #FF4757;
      border: 2.5px solid #070B1E;
      font-family: 'SBAggroB', sans-serif;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: skewX(6deg);
    }

    /* Tilted Golden Arcade Title Top-Right/Center */
    .hero-title-wrap {
      position: absolute;
      right: 30px;
      top: 74px;
      text-align: right;
      transform: rotate(-3deg);
      z-index: 20;
    }
    .game-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 62px;
      line-height: 1.02;
      color: #FFE44D;
      paint-order: stroke fill;
      -webkit-text-stroke: 9px #070B1E;
      text-shadow: 0 7px 0 #070B1E;
      filter: drop-shadow(0 0 18px rgba(255, 214, 10, 0.45));
    }
    .title-sub-ribbon {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 16px;
      background: linear-gradient(90deg, #0284C7, #7C3AED);
      border: 3px solid #070B1E;
      border-radius: 10px;
      transform: skewX(-8deg);
      font-family: 'SBAggroB', sans-serif;
      font-size: 15px;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #070B1E;
    }

    /* Center-Left Podium Tag */
    .podium-badge {
      position: absolute;
      left: 225px;
      bottom: 24px;
      padding: 7px 18px;
      background: rgba(11, 18, 48, 0.9);
      border: 3px solid #00E5FF;
      outline: 3px solid #070B1E;
      border-radius: 99px;
      transform: skewX(-6deg);
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      color: #E0F2FE;
      box-shadow: 0 4px 0 #070B1E;
      z-index: 15;
    }

    /* Right Grade Shield Selector + Giant Play Button */
    .right-lobby-panel {
      position: absolute;
      right: 28px;
      top: 210px;
      width: 372px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 20;
    }
    .grade-card {
      padding: 16px 18px 18px;
      background: linear-gradient(180deg, rgba(24, 41, 108, 0.95) 0%, rgba(12, 20, 56, 0.96) 100%);
      border: 3.5px solid #00E5FF;
      outline: 3.5px solid #070B1E;
      border-radius: 18px;
      transform: skewX(-4deg);
      box-shadow: 0 7px 0 #070B1E;
    }
    .grade-card-inner {
      transform: skewX(4deg);
    }
    .grade-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .grade-heading-title {
      font-family: 'SBAggroB', sans-serif;
      font-size: 17px;
      color: #FFE44D;
    }
    .grade-unit {
      font-size: 13px;
      color: #93C5FD;
    }
    .shield-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .shield-badge {
      position: relative;
      height: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #273E8F 0%, #162359 100%);
      border: 3px solid #475569;
      outline: 2.5px solid #070B1E;
      border-radius: 14px 14px 26px 26px;
      box-shadow: 0 4px 0 #070B1E;
    }
    .shield-badge.active {
      background: linear-gradient(180deg, #FBBF24 0%, #D97706 100%);
      border-color: #FFFBEB;
      box-shadow: 0 0 18px rgba(255, 214, 10, 0.65), 0 5px 0 #070B1E;
      transform: translateY(-3px);
    }
    .shield-num {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 28px;
      line-height: 1;
    }
    .shield-sub {
      font-family: 'Jua', sans-serif;
      font-size: 13px;
    }

    /* Giant Skewed Extruded Play CTA */
    .play-cta {
      width: 100%;
      height: 112px;
      border-radius: 22px;
      transform: skewX(-6deg);
      background: linear-gradient(180deg, #FFE866 0%, #FFB800 52%, #FF5733 100%);
      border: 4px solid #FFFBEB;
      outline: 4px solid #070B1E;
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.75),
        0 10px 0 #9A3412,
        0 14px 0 #070B1E,
        0 18px 30px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-cta-inner {
      transform: skewX(6deg);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .play-cta-text {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 52px;
      line-height: 1;
      color: #FFFFFF;
    }
    .play-cta-sub {
      font-family: 'SBAggroB', sans-serif;
      font-size: 14px;
      color: #FEF08A;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg-art" src="assets/b-home-bg.webp" alt="툰 3D 브롤 아레나 홈 로비" />

    <!-- Top Player & Resource Strip -->
    <header class="top-bar">
      <div class="profile-chip">
        <div class="profile-inner">
          <div class="avatar-badge">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z" fill="#FFF" stroke="#070B1E" stroke-width="1.8"/>
            </svg>
          </div>
          <div>
            <div style="font-size:12px;color:#7DD3FC;">어휘 수호자 · Lv.12</div>
            <div class="font-aggro stroke-sm" style="font-size:17px;">별빛궁수대장</div>
          </div>
        </div>
      </div>

      <div class="res-group">
        <div class="res-pill">
          <div class="unskew" style="display:flex;align-items:center;gap:7px;">
            <svg width="22" height="22" viewBox="0 0 32 32">
              <circle cx="16" cy="17" r="12" fill="#B45309" stroke="#070B1E" stroke-width="2.5"/>
              <circle cx="16" cy="14" r="12" fill="#FFD60A" stroke="#070B1E" stroke-width="2.5"/>
              <circle cx="16" cy="14" r="7" fill="none" stroke="#FFF8C9" stroke-width="1.6"/>
            </svg>
            <span class="font-aggro stroke-sm" style="font-size:18px;color:#FFE44D;">2,480</span>
          </div>
        </div>
        <div class="res-pill gem">
          <div class="unskew" style="display:flex;align-items:center;gap:7px;">
            <svg width="22" height="22" viewBox="0 0 32 32">
              <polygon points="16,3 28,12 23,28 9,28 4,12" fill="#C084FC" stroke="#070B1E" stroke-width="2.5"/>
              <polygon points="16,3 22,12 16,28 10,12" fill="#E9D5FF" opacity="0.55"/>
            </svg>
            <span class="font-aggro stroke-sm" style="font-size:18px;color:#E9D5FF;">85</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Left Floating 3D Arcade Menu -->
    <nav class="left-menu">
      <button class="btn-3d btn-cyan menu-btn">
        <span class="unskew">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <rect x="5" y="4" width="22" height="24" rx="4" fill="#FFE44D" stroke="#070B1E" stroke-width="2.5"/>
            <path d="M16 10 L18 14 L22 14.5 L19 17.5 L19.8 21.5 L16 19.5 L12.2 21.5 L13 17.5 L10 14.5 L14 14 Z" fill="#EF4444" stroke="#070B1E" stroke-width="1.5"/>
          </svg>
          <div style="text-align:left;">
            <div class="menu-title stroke-sm">도감</div>
            <div class="menu-sub">영웅 12/20</div>
          </div>
        </span>
      </button>

      <button class="btn-3d btn-navy menu-btn">
        <span class="notif-dot stroke-sm">3</span>
        <span class="unskew">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <rect x="6" y="4" width="20" height="24" rx="4" fill="#F472B6" stroke="#070B1E" stroke-width="2.5"/>
            <line x1="11" y1="11" x2="21" y2="11" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="11" y1="17" x2="21" y2="17" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="11" y1="23" x2="17" y2="23" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <div style="text-align:left;">
            <div class="menu-title stroke-sm">오답노트</div>
            <div class="menu-sub">복습 보너스!</div>
          </div>
        </span>
      </button>

      <button class="btn-3d btn-emerald menu-btn">
        <span class="unskew">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <path d="M5 24 L8 10 L16 16 L24 10 L27 24 Z" fill="#FFD60A" stroke="#070B1E" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="8" cy="8" r="2.5" fill="#FF4757" stroke="#070B1E" stroke-width="1.5"/>
            <circle cx="16" cy="6" r="2.5" fill="#00E5FF" stroke="#070B1E" stroke-width="1.5"/>
            <circle cx="24" cy="8" r="2.5" fill="#FF4757" stroke="#070B1E" stroke-width="1.5"/>
          </svg>
          <div style="text-align:left;">
            <div class="menu-title stroke-sm">랭킹</div>
            <div class="menu-sub">우리 반 2위</div>
          </div>
        </span>
      </button>
    </nav>

    <!-- Tilted Golden Title -->
    <div class="hero-title-wrap">
      <div class="game-title">어휘 브롤 디펜스</div>
      <div class="title-sub-ribbon stroke-sm">시즌 1 · 별빛 아레나 대격돌!</div>
    </div>

    <!-- Center-Left Podium Caption -->
    <div class="podium-badge">
      <span class="unskew" style="display:block;">대표 덱 · 별활 레인저 + 팝콘 곰 + 젤라또 펭귄</span>
    </div>

    <!-- Right Grade Shield Selector + Giant Play Button -->
    <section class="right-lobby-panel">
      <div class="grade-card">
        <div class="grade-card-inner">
          <div class="grade-heading">
            <span class="grade-heading-title stroke-sm">도전 학년 선택</span>
            <span class="grade-unit">핵심 어휘 120단어</span>
          </div>
          <div class="shield-grid">
            <div class="shield-badge">
              <div class="shield-num stroke-sm">3</div>
              <div class="shield-sub">학년</div>
            </div>
            <div class="shield-badge">
              <div class="shield-num stroke-sm">4</div>
              <div class="shield-sub">학년</div>
            </div>
            <div class="shield-badge active">
              <div class="shield-num stroke-sm">5</div>
              <div class="shield-sub stroke-sm">학년</div>
            </div>
            <div class="shield-badge">
              <div class="shield-num stroke-sm">6</div>
              <div class="shield-sub">학년</div>
            </div>
          </div>
        </div>
      </div>

      <button class="play-cta">
        <div class="play-cta-inner">
          <svg width="46" height="46" viewBox="0 0 48 48">
            <polygon points="12,8 40,24 12,40" fill="#FFFFFF" stroke="#070B1E" stroke-width="4" stroke-linejoin="round"/>
          </svg>
          <div>
            <div class="play-cta-text stroke-lg">출격!</div>
            <div class="play-cta-sub stroke-sm">5학년 아레나 · 웨이브 15</div>
          </div>
        </div>
      </button>
    </section>
  </div>
</body>
</html>
