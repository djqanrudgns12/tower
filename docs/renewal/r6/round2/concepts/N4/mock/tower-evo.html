<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>연필궁수의 진화 · 문방구 히어로즈</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="./n4-theme.css">
</head>
<body>
  <main class="scene evolution-scene">
    <img class="scene-art" src="./assets/c-tower-evo.webp" alt="지우개 모자 연필궁수에서 만년필 기사, 황금 캘리그래피 왕으로 커지는 세 단계">
    <a class="sticker back" href="./home.html">← 본부</a>
    <header class="shelf-title">
      <h1 class="ink-title">연필궁수의 진화</h1>
    </header>
    <ol class="shelf-labels evolution-labels" aria-label="연필궁수 진화 단계">
      <li class="shelf-card">
        <span class="level">Lv. 1</span>
        <h2>지우개모자 연필궁수</h2>
        <p>연필심 화살로 선두를 겨냥해요.</p>
      </li>
      <li class="shelf-card shelf-card--sky">
        <span class="level">Lv. 4</span>
        <h2>만년필 기사</h2>
        <p>은빛 펜촉으로 적의 방어를 뚫어요.</p>
      </li>
      <li class="shelf-card shelf-card--gold">
        <span class="level">Lv. 7</span>
        <h2>황금 캘리그래피 왕</h2>
        <p>황금 쌍활로 무지개 먹물을 날려요.</p>
      </li>
    </ol>
  </main>
