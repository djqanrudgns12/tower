<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>네온 페인트 수호대 · 홈</title>
  <link rel="stylesheet" href="n5-theme.css">
</head>
<body>
<main class="stage home">
  <img class="art" src="assets/b-home-bg.webp" alt="">
  <div class="shade"></div>
  <header class="home-crest">
    <h1 class="ink-title">네온 페인트<span>수호대</span></h1>
    <div class="grades" aria-label="학년 · 5학년 선택">
      <span class="tag dark"><span>3G</span></span>
      <span class="tag dark"><span>4G</span></span>
      <span class="tag pink"><span>5G</span></span>
      <span class="tag dark"><span>6G</span></span>
    </div>
  </header>
  <div class="home-foot">
    <section class="deck panel" aria-labelledby="deck-title">
      <div class="deck-head">
        <h2 id="deck-title">내 타워 덱</h2>
        <a href="enemy-pack.html">적군 도감 →</a>
      </div>
      <div class="deck-towers">
        <a class="tower-card rare" href="tower-evo.html">
          <span class="pip" aria-hidden="true">➶</span><span><strong>페인트활 스나이퍼</strong><small>정밀 공격 · Lv1</small></span>
        </a>
        <div class="tower-card common">
          <span class="pip" aria-hidden="true">✹</span><span><strong>트윈노즐 포</strong><small>범위 공격 · Lv1</small></span>
        </div>
        <div class="tower-card epic">
          <span class="pip" aria-hidden="true">◉</span><span><strong>슬러시 DJ</strong><small>둔화 · Lv4</small></span>
        </div>
        <div class="tower-card legendary">
          <span class="pip" aria-hidden="true">✦</span><span><strong>그래피티 드론</strong><small>지속 공격 · Lv1</small></span>
        </div>
      </div>
    </section>
    <a class="splash start" href="battle.html"><span>배틀 스타트!</span></a>
  </div>
</main>
</body>
</html>
