<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>네온 페인트 수호대 · 적군 도감</title>
  <link rel="stylesheet" href="n5-theme.css">
</head>
<body>
<main class="stage sheet">
  <img class="art enemy-art" src="assets/d-enemy-pack.webp" alt="붐박스를 이고 춤추는 오리, 스케이트보드 문어푸딩, 거품 새는 스프레이캔, 왕눈이 라바콘, 왕관을 쓴 고릴라봇.">
  <div class="shade"></div>
  <header class="sheet-heading">
    <h1 class="ink-title">적군 도감</h1>
    <p>옥상 스케이트 파크</p>
  </header>
  <a class="tag dark corner-link" href="home.html"><span>로비</span></a>
  <section class="lineup enemies" aria-label="적군 특성">
    <article class="panel caption-card common">
      <span class="tag"><span>행진</span></span>
      <h2>붐박스 오리</h2>
      <p>박자에 맞춰 뒤뚱뒤뚱</p>
    </article>
    <article class="panel caption-card rare">
      <span class="tag"><span>질주</span></span>
      <h2>문어푸딩</h2>
      <p>보드를 타고 쌩!</p>
    </article>
    <article class="panel caption-card epic">
      <span class="tag"><span>방해</span></span>
      <h2>스프레이캔 임프</h2>
      <p>거품이 보글보글</p>
    </article>
    <article class="panel caption-card common">
      <span class="tag"><span>방어</span></span>
      <h2>왕눈이 라바콘</h2>
      <p>콘 속에서 눈만 빼꼼</p>
    </article>
    <article class="panel caption-card legendary">
      <span class="tag"><span>보스</span></span>
      <h2>그래피티 고릴라봇</h2>
      <p>양손으로 무지개 물감 발사</p>
    </article>
  </section>
</main>
</body>
</html>
