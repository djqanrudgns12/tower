<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>R02 · 전투 화면 시안 (아이소메트릭 픽셀 아트)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #161B2E;
      --surface: #2B3654;
      --frame: #7E8FA6;
      --ink: #D4DDE8;
      --amber: #E09F3E;
      --cyan: #4EA8DE;
      --shadow: #0B0E18;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Galmuri11', monospace;
      -webkit-font-smoothing: none;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      background: var(--bg);
    }

    .bg-battle {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 720px;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
    }

    /* 각진 2px 픽셀 프레임 */
    .px-panel {
      background: rgba(22, 27, 46, 0.94);
      border: 2px solid var(--frame);
      box-shadow: 4px 4px 0 var(--shadow), inset 0 0 0 2px var(--surface);
      border-radius: 0;
    }

    /* 상단 좌측~중앙 HUD 바 */
    .hud-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      height: 46px;
    }

    .hud-stat {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      background: var(--surface);
      border: 2px solid var(--frame);
      font-size: 14px;
      line-height: 1;
      white-space: nowrap;
    }

    .hud-label {
      color: var(--frame);
      font-size: 12px;
    }

    .hud-val {
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
    }

    .hud-val.amber { color: var(--amber); }
    .hud-val.cyan { color: var(--cyan); }

    .px-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot-gate { background: var(--cyan); box-shadow: 2px 2px 0 var(--shadow); }
    .dot-gold { background: var(--amber); box-shadow: 2px 2px 0 var(--shadow); }
    .dot-wave { background: var(--ink); box-shadow: 2px 2px 0 var(--shadow); }
    .dot-enemy { background: var(--frame); box-shadow: 2px 2px 0 var(--shadow); }

    .btn-pause {
      margin-left: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg);
      border: 2px solid var(--amber);
      color: var(--amber);
      font-family: 'Galmuri11', monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--shadow);
    }

    /* 우측 타워 목록 */
    .tower-dock {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 236px;
      padding: 10px;
    }

    .dock-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--surface);
    }

    .dock-hint {
      font-size: 11px;
      color: var(--frame);
      font-weight: 400;
    }

    .tower-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .tower-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      background: var(--bg);
      border: 2px solid var(--surface);
      position: relative;
    }

    .tower-item.selected {
      background: var(--surface);
      border-color: var(--cyan);
      box-shadow: inset 3px 0 0 var(--cyan);
    }

    .tower-thumb {
      width: 40px;
      height: 40px;
      background: var(--bg);
      border: 2px solid var(--frame);
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .tower-item.selected .tower-thumb {
      border-color: var(--cyan);
    }

    .tower-meta {
      flex: 1;
      min-width: 0;
    }

    .tower-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .tower-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .tower-cost {
      color: var(--amber);
      font-weight: 700;
    }

    .tower-item.selected .tower-key {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .tower-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--frame);
      font-family: 'Galmuri11', monospace;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    /* 하단 어휘 문제 패널 (우하단 성문이 보이도록 좌측 정렬 924px) */
    .quiz-panel {
      position: absolute;
      bottom: 14px;
      left: 16px;
      width: 924px;
      padding: 12px 16px 14px;
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .quiz-tag-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-badge {
      background: var(--surface);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
    }

    .quiz-reward {
      font-size: 12px;
      color: var(--amber);
      font-weight: 700;
    }

    .btn-skip {
      background: var(--surface);
      border: 2px solid var(--frame);
      color: var(--ink);
      font-family: 'Galmuri11', monospace;
      font-size: 12px;
      padding: 4px 10px;
      box-shadow: 2px 2px 0 var(--shadow);
      cursor: pointer;
    }

    .quiz-question {
      font-family: 'Pretendard', 'Galmuri11', sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: var(--bg);
      border: 2px solid var(--surface);
      padding: 10px 14px;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .blank-slot {
      display: inline-block;
      min-width: 78px;
      text-align: center;
      padding: 0 8px;
      margin: 0 3px;
      background: var(--surface);
      border: 2px solid var(--amber);
      color: var(--amber);
      font-family: 'Galmuri11', monospace;
      font-size: 16px;
      vertical-align: baseline;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      background: var(--surface);
      border: 2px solid var(--frame);
      box-shadow: 3px 3px 0 var(--shadow);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .choice-btn.active {
      border-color: var(--cyan);
      background: #22304C;
    }

    .choice-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--bg);
      border: 2px solid var(--frame);
      color: var(--amber);
      font-family: 'Galmuri11', monospace;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .choice-btn.active .choice-num {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .choice-text {
      font-family: 'Pretendard', 'Galmuri11', sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg-battle" src="assets/battle.webp" alt="아이소메트릭 픽셀 전장" />

    <!-- 상단 HUD -->
    <header class="hud-bar px-panel">
      <div class="hud-stat">
        <span class="px-dot dot-gate"></span>
        <span class="hud-label">성문</span>
        <span class="hud-val cyan">20/20</span>
      </div>
      <div class="hud-stat">
        <span class="px-dot dot-gold"></span>
        <span class="hud-label">골드</span>
        <span class="hud-val amber">240</span>
      </div>
      <div class="hud-stat">
        <span class="px-dot dot-wave"></span>
        <span class="hud-label">웨이브</span>
        <span class="hud-val">3/10</span>
      </div>
      <div class="hud-stat">
        <span class="px-dot dot-enemy"></span>
        <span class="hud-label">남은 적</span>
        <span class="hud-val">12</span>
      </div>
      <button type="button" class="btn-pause">|| 일시정지</button>
    </header>

    <!-- 우측 타워 목록 -->
    <aside class="tower-dock px-panel">
      <div class="dock-title">
        <span>타워 설치</span>
        <span class="dock-hint">1~4 선택</span>
      </div>
      <div class="tower-list">
        <div class="tower-item selected">
          <canvas class="tower-thumb" width="40" height="40" data-box="117,67,215,266"></canvas>
          <div class="tower-meta">
            <div class="tower-name">목조 자동 쇠뇌탑</div>
            <div class="tower-sub">
              <span class="tower-cost">60G</span>
              <span class="tower-key">1</span>
            </div>
          </div>
        </div>
        <div class="tower-item">
          <canvas class="tower-thumb" width="40" height="40" data-box="106,436,238,275"></canvas>
          <div class="tower-meta">
            <div class="tower-name">석조 박격포</div>
            <div class="tower-sub">
              <span class="tower-cost">90G</span>
              <span class="tower-key">2</span>
            </div>
          </div>
        </div>
        <div class="tower-item">
          <canvas class="tower-thumb" width="40" height="40" data-box="559,424,258,293"></canvas>
          <div class="tower-meta">
            <div class="tower-name">수정 등대탑</div>
            <div class="tower-sub">
              <span class="tower-cost">110G</span>
              <span class="tower-key">3</span>
            </div>
          </div>
        </div>
        <div class="tower-item">
          <canvas class="tower-thumb" width="40" height="40" data-box="1010,439,274,271"></canvas>
          <div class="tower-meta">
            <div class="tower-name">톱니 서리탑</div>
            <div class="tower-sub">
              <span class="tower-cost">100G</span>
              <span class="tower-key">4</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 하단 어휘 문제 패널 -->
    <section class="quiz-panel px-panel">
      <div class="quiz-top">
        <div class="quiz-tag-group">
          <span class="quiz-badge">어휘 문제</span>
          <span class="quiz-reward">정답 시 +40G</span>
        </div>
        <button type="button" class="btn-skip">모르겠어요</button>
      </div>
      <p class="quiz-question">
        할아버지는 욕심을 부리지 않고 마음이 깨끗한 분이어서, 사람들은 할아버지의 그런 <span class="blank-slot">( &nbsp;&nbsp;&nbsp;&nbsp; )</span> 성품을 존경했습니다.
      </p>
      <div class="choices-grid">
        <button type="button" class="choice-btn">
          <span class="choice-num">1</span>
          <span class="choice-text">꼼꼼한</span>
        </button>
        <button type="button" class="choice-btn">
          <span class="choice-num">2</span>
          <span class="choice-text">씩씩한</span>
        </button>
        <button type="button" class="choice-btn">
          <span class="choice-num">3</span>
          <span class="choice-text">부지런한</span>
        </button>
        <button type="button" class="choice-btn active">
          <span class="choice-num">4</span>
          <span class="choice-text">담백한</span>
        </button>
      </div>
    </section>
  </div>

  <script>
    window.__renderReady = (async () => {
      const sheet = new Image();
      sheet.src = 'assets/towers.webp';
      await sheet.decode();
      document.querySelectorAll('canvas.tower-thumb').forEach((canvas) => {
        const [sx, sy, sw, sh] = canvas.dataset.box.split(',').map(Number);
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = '#161B2E';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const pad = 3;
        const availW = canvas.width - pad * 2;
        const availH = canvas.height - pad * 2;
        const scale = Math.min(availW / sw, availH / sh);
        const dw = Math.round(sw * scale);
        const dh = Math.round(sh * scale);
        const dx = Math.round((canvas.width - dw) / 2);
        const dy = Math.round((canvas.height - dh) / 2);
        ctx.drawImage(sheet, sx, sy, sw, sh, dx, dy, dw, dh);
      });
    })();
  </script>
</body>
</html>
