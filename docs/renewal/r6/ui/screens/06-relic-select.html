<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보물 선택 — 어휘력 타워 디펜스 R6</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../shared.css" />
  <script defer src="./hydrate-icons.js"></script>
  <style>
    .relic-root {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg-canvas);
    }
    .battle-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .battle-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-left {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }
    .header-note {
      font-size: var(--fs-caption);
      color: var(--text-muted);
      font-weight: 500;
    }

    .relic-body {
      padding: var(--sp-4);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    /* 3열 보물 카드 그리드 */
    .relic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp-3);
    }
    .relic-card-btn {
      display: block;
      width: 100%;
      height: 100%;
      text-align: left;
    }
    .relic-card-btn .c-card {
      height: 100%;
    }
    .relic-card-inner {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--sp-3);
      position: relative;
    }
    .c-card.is-selected > .relic-card-inner {
      background: var(--bg-elevated);
      box-shadow: inset 0 -3px 0 var(--accent-teal);
    }
    .relic-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-2);
    }
    .relic-icon-box {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-panel);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-body);
    }
    .c-card.is-selected .relic-icon-box {
      border-color: var(--accent-teal);
      background: var(--accent-teal-dim);
      color: var(--accent-teal);
    }
    .relic-selected-tag {
      display: none;
      background: var(--accent-teal);
      border-color: var(--accent-teal);
      color: var(--on-accent);
      font-weight: 700;
    }
    .c-card.is-selected .relic-selected-tag {
      display: inline-flex;
    }

    .relic-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .relic-name {
      font-family: var(--font-display);
      font-size: var(--fs-heading);
      font-weight: 700;
      color: var(--text-strong);
    }
    .relic-target {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      padding: 2px 8px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-panel);
      font-size: var(--fs-caption);
      color: var(--text-muted);
      font-weight: 600;
    }
    .relic-effect {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-amber);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }
    .c-card.is-selected .relic-effect {
      color: var(--accent-teal);
    }
    .relic-desc {
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.4;
    }

    /* 하단 힌트 + 확인 CTA */
    .relic-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding-top: var(--sp-3);
      border-top: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }
    .key-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-caption);
      color: var(--text-muted);
    }
    .keycap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-card);
      color: var(--text-strong);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .relic-body { padding: var(--sp-3); gap: var(--sp-3); }
      .header-note { display: none; }
      .relic-grid { grid-template-columns: 1fr; gap: var(--sp-2); }
      .relic-card-inner {
        padding: var(--sp-3);
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: var(--sp-3);
      }
      .c-card.is-selected > .relic-card-inner {
        box-shadow: inset 3px 0 0 var(--accent-teal);
      }
      .relic-card-top {
        flex-direction: column;
        align-items: center;
        flex: none;
      }
      .relic-icon-box { width: 44px; height: 44px; }
      .relic-name { font-size: 16px; }
      .relic-effect { font-size: 15px; }
      .relic-footer { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
      .key-hint { justify-content: center; }
      .relic-footer .btn { width: 100%; }
    }
  </style>
</head>
<body class="relic-root">
  <div class="battle-bg" aria-hidden="true">
    <img src="../assets/battle-map.webp" alt="" />
  </div>
  <div class="modal-backdrop" aria-hidden="true"></div>

  <div class="modal-stage">
    <main class="modal-shell">
      <div class="c-panel">
        <div class="c-inner">
          <header class="modal-header">
            <div class="header-left">
              <h1 class="modal-title">
                <i class="icon-amber" data-icon="hud/chest" data-size="22"></i>
                <span>보물 선택</span>
              </h1>
              <span class="tag tag-amber">10웨이브 보상</span>
            </div>
            <span class="header-note">이번 판에만 적용돼요</span>
          </header>

          <div class="relic-body">
            <div class="relic-grid" role="radiogroup" aria-label="보물 3종 선택">
              <!-- 1. 정밀 조준경 (선택 포커스) -->
              <button type="button" class="relic-card-btn" role="radio" aria-checked="true" data-relic-name="정밀 조준경">
                <div class="c-card is-selected">
                  <div class="c-inner relic-card-inner">
                    <div class="relic-card-top">
                      <span class="relic-icon-box"><i data-icon="relics/arrow_range" data-size="28"></i></span>
                      <span class="tag tag-teal relic-selected-tag">
                        <i data-icon="hud/check" data-size="12"></i>선택됨
                      </span>
                    </div>
                    <div class="relic-info">
                      <h2 class="relic-name">정밀 조준경</h2>
                      <span class="relic-target">레일 포탑 · 드론 격납고</span>
                      <p class="relic-effect num">사거리 +15%</p>
                      <p class="relic-desc">원거리 전술 타워가 더 멀리 있는 적부터 먼저 노려요.</p>
                    </div>
                  </div>
                </div>
              </button>

              <!-- 2. 냉각 코어 -->
              <button type="button" class="relic-card-btn" role="radio" aria-checked="false" data-relic-name="냉각 코어">
                <div class="c-card">
                  <div class="c-inner relic-card-inner">
                    <div class="relic-card-top">
                      <span class="relic-icon-box"><i data-icon="relics/frost_bead" data-size="28"></i></span>
                      <span class="tag tag-teal relic-selected-tag">
                        <i data-icon="hud/check" data-size="12"></i>선택됨
                      </span>
                    </div>
                    <div class="relic-info">
                      <h2 class="relic-name">냉각 코어</h2>
                      <span class="relic-target">감속 효과</span>
                      <p class="relic-effect num">느리게 하는 시간 +40%</p>
                      <p class="relic-desc">감속 파동에 닿은 적의 이동 속도 저하가 오래 유지돼요.</p>
                    </div>
                  </div>
                </div>
              </button>

              <!-- 3. 어휘 교본 -->
              <button type="button" class="relic-card-btn" role="radio" aria-checked="false" data-relic-name="어휘 교본">
                <div class="c-card">
                  <div class="c-inner relic-card-inner">
                    <div class="relic-card-top">
                      <span class="relic-icon-box"><i data-icon="relics/wise_book" data-size="28"></i></span>
                      <span class="tag tag-teal relic-selected-tag">
                        <i data-icon="hud/check" data-size="12"></i>선택됨
                      </span>
                    </div>
                    <div class="relic-info">
                      <h2 class="relic-name">어휘 교본</h2>
                      <span class="relic-target">어휘 문제</span>
                      <p class="relic-effect num">정답 골드 +3</p>
                      <p class="relic-desc">어휘 문제를 맞힐 때마다 받는 골드가 3씩 늘어나요.</p>
                    </div>
                  </div>
                </div>
              </button>
            </div>

            <footer class="relic-footer">
              <div class="key-hint">
                <span class="keycap">←</span>
                <span class="keycap">→</span>
                <span>방향키로 이동 ·</span>
                <span class="keycap">Enter</span>
                <span>로 선택</span>
              </div>
              <button type="button" class="btn btn-primary btn-lg" id="confirm-relic-btn">
                <i data-icon="hud/check" data-size="18"></i>
                <span id="confirm-relic-label">정밀 조준경 선택</span>
              </button>
            </footer>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.relic-card-btn'));
      var label = document.getElementById('confirm-relic-label');
      var activeIdx = 0;

      function selectIndex(idx) {
        activeIdx = (idx + buttons.length) % buttons.length;
        buttons.forEach(function (btn, i) {
          var selected = i === activeIdx;
          btn.setAttribute('aria-checked', selected ? 'true' : 'false');
          var card = btn.querySelector('.c-card');
          if (card) card.classList.toggle('is-selected', selected);
        });
        if (label) {
          label.textContent = buttons[activeIdx].getAttribute('data-relic-name') + ' 선택';
        }
      }

      buttons.forEach(function (btn, i) {
        btn.addEventListener('click', function () { selectIndex(i); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          selectIndex(activeIdx - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          selectIndex(activeIdx + 1);
        }
      });
    })();
  </script>
</body>
</html>
