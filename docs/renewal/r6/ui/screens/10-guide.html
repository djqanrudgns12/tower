<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사용 설명서 — 어휘 타워 디펜스 R04</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../shared.css" />
  <script defer src="./hydrate-icons.js"></script>
  <style>
    .guide-tabs {
      flex-wrap: wrap;
    }

    .guide-tabs .tab-btn {
      padding: 10px 12px;
    }

    .guide-body {
      padding: var(--sp-4);
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      gap: var(--sp-4);
      align-items: start;
    }

    .demo-col {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-width: 0;
    }

    .diagram-frame-inner {
      padding: var(--sp-3);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .diagram-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      font-size: var(--fs-caption);
      color: var(--text-muted);
    }

    .diagram-title {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text-strong);
      font-size: var(--fs-body);
    }

    .guide-svg {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid var(--border-hairline);
      background: var(--r04-carbon);
    }

    .summary-col {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-width: 0;
    }

    .step-card-inner {
      padding: var(--sp-3);
      display: flex;
      gap: var(--sp-3);
      align-items: flex-start;
    }

    .step-num-badge {
      width: 26px;
      height: 26px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent-teal);
      background: var(--accent-teal-dim);
      color: var(--accent-teal);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--fs-caption);
    }

    .step-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .step-heading {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text-strong);
    }

    .step-desc {
      font-size: var(--fs-body);
      color: var(--text-body);
      line-height: 1.5;
    }

    .guide-tip-strip {
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--border-hairline);
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      font-size: var(--fs-caption);
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .guide-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .guide-tabs .tab-btn:last-child {
        grid-column: span 2;
      }
      .guide-tabs .tab-btn {
        justify-content: flex-start;
        padding: 8px 10px;
      }
      .guide-body {
        padding: var(--sp-3);
        grid-template-columns: minmax(0, 1fr);
        gap: var(--sp-3);
      }
    }
  </style>
</head>
<body class="tac-grid-bg">
  <div class="modal-backdrop" aria-hidden="true"></div>

  <main class="modal-stage">
    <section class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="c-panel">
        <div class="c-inner">
          <header class="modal-header">
            <h1 class="modal-title" id="guide-title">
              <i data-icon="hud/guide" data-size="20"></i>
              <span>사용 설명서</span>
            </h1>
            <button type="button" class="icon-close-btn" aria-label="닫기">
              <i data-icon="hud/close" data-size="18"></i>
            </button>
          </header>

          <!-- 상단 5장 탭 -->
          <div class="tab-rail guide-tabs" role="tablist" aria-label="사용 설명서 장 선택">
            <button type="button" class="tab-btn" role="tab" aria-selected="false">1. 한 판 흐름</button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false">2. 문제와 골드</button>
            <button type="button" class="tab-btn is-active" role="tab" aria-selected="true">3. 타워 놓기와 진화</button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false">4. 시작과 끝내기</button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false">5. 적 특성</button>
          </div>

          <!-- 2열 본문 -->
          <div class="guide-body">
            <!-- 좌측 시연 무대 -->
            <div class="demo-col">
              <!-- 도식 1: R04 등고선 격자 위 사거리 원이 표시된 전술 도식 -->
              <div class="c-card">
                <div class="c-inner diagram-frame-inner">
                  <div class="diagram-caption">
                    <span class="diagram-title">전술 설치 및 사거리 도식</span>
                    <span class="num">사거리 R=96</span>
                  </div>
                  <svg class="guide-svg" viewBox="0 0 420 200" role="img" aria-label="등고선 격자와 팔각 설치 칸, 틸 사거리 원 도식">
                    <!-- 배경 격자 -->
                    <defs>
                      <pattern id="r04-grid" width="28" height="28" patternUnits="userSpaceOnUse">
                        <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#26303B" stroke-width="1" />
                      </pattern>
                    </defs>
                    <rect width="420" height="200" fill="#12161B" />
                    <rect width="420" height="200" fill="url(#r04-grid)" />

                    <!-- 등고선 (지형선) -->
                    <path d="M 0 38 Q 85 20 165 44 T 335 30 L 420 42" fill="none" stroke="#2D3744" stroke-width="1.2" />
                    <path d="M 0 172 Q 110 156 200 178 T 420 164" fill="none" stroke="#2D3744" stroke-width="1.2" />

                    <!-- 적 이동 경로 -->
                    <polyline points="20,104 128,104 164,62 278,62 314,136 400,136" fill="none" stroke="#1D242C" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter" />
                    <polyline points="20,104 128,104 164,62 278,62 314,136 400,136" fill="none" stroke="#4A5563" stroke-width="1.5" stroke-dasharray="6 5" />

                    <!-- 빈 팔각 설치 칸 (좌하단) -->
                    <polygon points="88,138 104,138 112,146 112,162 104,170 88,170 80,162 80,146" fill="#1D242C" stroke="#4A5563" stroke-width="1.5" />
                    <line x1="96" y1="148" x2="96" y2="160" stroke="#939EAB" stroke-width="1.5" />
                    <line x1="90" y1="154" x2="102" y2="154" stroke="#939EAB" stroke-width="1.5" />

                    <!-- 빈 팔각 설치 칸 (우상단) -->
                    <polygon points="334,32 350,32 358,40 358,56 350,64 334,64 326,56 326,40" fill="#1D242C" stroke="#4A5563" stroke-width="1.5" />
                    <line x1="342" y1="42" x2="342" y2="54" stroke="#939EAB" stroke-width="1.5" />
                    <line x1="336" y1="48" x2="348" y2="48" stroke="#939EAB" stroke-width="1.5" />

                    <!-- 선택된 팔각 칸 + 틸 사거리 원 -->
                    <circle cx="222" cy="116" r="78" fill="rgba(47, 181, 163, 0.14)" stroke="#2FB5A3" stroke-width="1.5" stroke-dasharray="5 4" />
                    <line x1="222" y1="116" x2="294" y2="86" stroke="#2FB5A3" stroke-width="1.25" />
                    <text x="248" y="94" fill="#2FB5A3" font-size="11" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">사거리</text>

                    <!-- 설치된 타워 기하학 마커 (Lv6 단계 II 포탑) -->
                    <polygon points="212,98 232,98 240,106 240,126 232,134 212,134 204,126 204,106" fill="#26303B" stroke="#2FB5A3" stroke-width="2" />
                    <rect x="215" y="109" width="14" height="14" fill="#12161B" stroke="#B8C0C8" stroke-width="1.5" />
                    <line x1="219" y1="109" x2="219" y2="92" stroke="#E69F24" stroke-width="2.5" />
                    <line x1="225" y1="109" x2="225" y2="92" stroke="#E69F24" stroke-width="2.5" />
                  </svg>
                </div>
              </div>

              <!-- 도식 2: Lv1(I) → Lv6(II) → Lv12(III) → Lv18(IV) 무기 4단계 진화 도해 -->
              <div class="c-card">
                <div class="c-inner diagram-frame-inner">
                  <div class="diagram-caption">
                    <span class="diagram-title">무기 4단계 진화 도해</span>
                    <span class="num">I → II → III → IV</span>
                  </div>
                  <svg class="guide-svg" viewBox="0 0 420 124" role="img" aria-label="Lv1 I단계, Lv6 II단계, Lv12 III단계, Lv18 IV단계 무기 진화 도해">
                    <rect width="420" height="124" fill="#12161B" />

                    <!-- 단계 I: Lv1 -->
                    <g transform="translate(14, 14)">
                      <rect x="0" y="0" width="84" height="96" fill="#1D242C" stroke="#4A5563" stroke-width="1" />
                      <polygon points="32,26 52,26 58,32 58,52 52,58 32,58 26,52 26,32" fill="#26303B" stroke="#6B7787" stroke-width="1.5" />
                      <line x1="42" y1="40" x2="42" y2="18" stroke="#B8C0C8" stroke-width="3" />
                      <circle cx="42" cy="42" r="5" fill="#12161B" stroke="#B8C0C8" stroke-width="1.5" />
                      <text x="42" y="76" text-anchor="middle" fill="#E6ECF2" font-size="11" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">Lv1 (I)</text>
                      <text x="42" y="90" text-anchor="middle" fill="#939EAB" font-size="10" font-family="SUIT, sans-serif">단일 포신</text>
                    </g>

                    <!-- 화살표 1 -->
                    <polyline points="103,62 111,62" fill="none" stroke="#E69F24" stroke-width="1.75" />
                    <polyline points="108,58 112,62 108,66" fill="none" stroke="#E69F24" stroke-width="1.75" />

                    <!-- 단계 II: Lv6 -->
                    <g transform="translate(116, 14)">
                      <rect x="0" y="0" width="84" height="96" fill="#1D242C" stroke="#4A5563" stroke-width="1" />
                      <polygon points="32,26 52,26 58,32 58,52 52,58 32,58 26,52 26,32" fill="#26303B" stroke="#2FB5A3" stroke-width="1.5" />
                      <line x1="38" y1="40" x2="38" y2="16" stroke="#2FB5A3" stroke-width="2.5" />
                      <line x1="46" y1="40" x2="46" y2="16" stroke="#2FB5A3" stroke-width="2.5" />
                      <rect x="35" y="36" width="14" height="12" fill="#12161B" stroke="#B8C0C8" stroke-width="1.5" />
                      <text x="42" y="76" text-anchor="middle" fill="#E6ECF2" font-size="11" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">Lv6 (II)</text>
                      <text x="42" y="90" text-anchor="middle" fill="#939EAB" font-size="10" font-family="SUIT, sans-serif">쌍포신 강화</text>
                    </g>

                    <!-- 화살표 2 -->
                    <polyline points="205,62 213,62" fill="none" stroke="#E69F24" stroke-width="1.75" />
                    <polyline points="210,58 214,62 210,66" fill="none" stroke="#E69F24" stroke-width="1.75" />

                    <!-- 단계 III: Lv12 -->
                    <g transform="translate(218, 14)">
                      <rect x="0" y="0" width="84" height="96" fill="#1D242C" stroke="#4A5563" stroke-width="1" />
                      <polygon points="30,24 54,24 60,30 60,54 54,60 30,60 24,54 24,30" fill="#26303B" stroke="#E69F24" stroke-width="1.5" />
                      <line x1="35" y1="38" x2="35" y2="14" stroke="#E69F24" stroke-width="2.5" />
                      <line x1="42" y1="38" x2="42" y2="12" stroke="#E6ECF2" stroke-width="2.5" />
                      <line x1="49" y1="38" x2="49" y2="14" stroke="#E69F24" stroke-width="2.5" />
                      <polygon points="42,33 50,47 34,47" fill="#12161B" stroke="#E69F24" stroke-width="1.5" />
                      <text x="42" y="76" text-anchor="middle" fill="#E6ECF2" font-size="11" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">Lv12 (III)</text>
                      <text x="42" y="90" text-anchor="middle" fill="#939EAB" font-size="10" font-family="SUIT, sans-serif">3연장 코어</text>
                    </g>

                    <!-- 화살표 3 -->
                    <polyline points="307,62 315,62" fill="none" stroke="#E69F24" stroke-width="1.75" />
                    <polyline points="312,58 316,62 312,66" fill="none" stroke="#E69F24" stroke-width="1.75" />

                    <!-- 단계 IV: Lv18 -->
                    <g transform="translate(320, 14)">
                      <rect x="0" y="0" width="86" height="96" fill="#1D242C" stroke="#E69F24" stroke-width="1.5" />
                      <polygon points="30,24 56,24 62,30 62,54 56,60 30,60 24,54 24,30" fill="#26303B" stroke="#E69F24" stroke-width="2" />
                      <line x1="24" y1="42" x2="18" y2="42" stroke="#2FB5A3" stroke-width="2" />
                      <line x1="62" y1="42" x2="68" y2="42" stroke="#2FB5A3" stroke-width="2" />
                      <line x1="36" y1="36" x2="36" y2="12" stroke="#E69F24" stroke-width="3" />
                      <line x1="50" y1="36" x2="50" y2="12" stroke="#E69F24" stroke-width="3" />
                      <line x1="43" y1="34" x2="43" y2="10" stroke="#2FB5A3" stroke-width="2.5" />
                      <polygon points="43,33 52,42 43,51 34,42" fill="#12161B" stroke="#E6ECF2" stroke-width="1.5" />
                      <text x="43" y="76" text-anchor="middle" fill="#E69F24" font-size="11" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">Lv18 (IV)</text>
                      <text x="43" y="90" text-anchor="middle" fill="#E6ECF2" font-size="10" font-family="SUIT, sans-serif">최종 4단계</text>
                    </g>
                  </svg>
                </div>
              </div>
            </div>

            <!-- 우측 3단계 요약 카드 -->
            <div class="summary-col">
              <article class="c-card is-selected">
                <div class="c-inner step-card-inner">
                  <span class="step-num-badge num">1</span>
                  <div class="step-content">
                    <h2 class="step-heading">사거리 원과 설치 칸</h2>
                    <p class="step-desc">빈 팔각 칸을 누르고 타워를 놓으면 청록색 사거리 원으로 공격 거리가 보여요.</p>
                  </div>
                </div>
              </article>

              <article class="c-card is-amber">
                <div class="c-inner step-card-inner">
                  <span class="step-num-badge num" style="border-color: var(--accent-amber); background: var(--accent-amber-dim); color: var(--accent-amber);">2</span>
                  <div class="step-content">
                    <h2 class="step-heading">Lv1~20 · 2레벨마다 진화</h2>
                    <p class="step-desc">2레벨마다 부품이 늘고, Lv6·12·18에서 무기 단계(I~IV)가 바뀌어요.</p>
                  </div>
                </div>
              </article>

              <article class="c-card">
                <div class="c-inner step-card-inner">
                  <span class="step-num-badge num">3</span>
                  <div class="step-content">
                    <h2 class="step-heading">60% 돌려받기 · 3초 되돌리기</h2>
                    <p class="step-desc">방금 놓은 타워는 3초 안에 전액 되돌리고, 이후에는 60% 골드로 팔 수 있어요.</p>
                  </div>
                </div>
              </article>

              <div class="guide-tip-strip">
                <span>단축키 1~5로 타워를 바로 고를 수 있어요</span>
                <i data-icon="hud/upgrade" data-size="16"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var tabs = document.querySelectorAll('.guide-tabs .tab-btn');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('is-active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('is-active');
          tab.setAttribute('aria-selected', 'true');
        });
      });
    })();
  </script>
</body>
</html>
