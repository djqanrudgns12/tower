<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일시정지 — 어휘 타워 디펜스 R04</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../shared.css" />
  <script defer src="./hydrate-icons.js"></script>
  <style>
    /* 커닝 방지: 전장·문제 내용이 완전히 가려지는 96% 불투명 다크 커버 */
    .pause-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(14, 18, 22, 0.96);
      z-index: 1;
    }
    :root[data-theme="light"] .pause-backdrop {
      background: rgba(230, 235, 240, 0.96);
    }

    .pause-stage {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: var(--sp-4);
    }

    .pause-body {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    .pause-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      color: var(--text-body);
      font-size: var(--fs-body);
    }

    .resume-btn {
      width: 100%;
    }

    .pause-controls {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      padding: var(--sp-3);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }

    .ctrl-label-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .ctrl-label {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--text-strong);
      font-size: var(--fs-body);
    }

    .ctrl-sub {
      font-size: var(--fs-caption);
      color: var(--text-muted);
    }

    .divider {
      height: 1px;
      background: var(--border-hairline);
      border: 0;
    }

    .end-section {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .end-section-title {
      font-family: var(--font-display);
      font-size: var(--fs-caption);
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .danger-box-inner {
      background: var(--bg-card);
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .danger-msg-row {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      color: var(--text-strong);
      font-size: var(--fs-body);
    }

    .danger-icon {
      color: var(--status-danger);
      flex: none;
      margin-top: 2px;
    }

    .danger-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--sp-2);
    }

    @media (max-width: 600px) {
      .pause-stage {
        padding: var(--sp-3);
        align-items: center;
      }
      .pause-body {
        padding: var(--sp-3);
        gap: var(--sp-3);
      }
      .ctrl-row-stack {
        flex-direction: column;
        align-items: stretch;
      }
      .ctrl-row-stack .seg-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .ctrl-row-stack .seg-btn {
        padding: 4px 6px;
        font-size: var(--fs-caption);
      }
      .danger-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body class="tac-grid-bg">
  <!-- 전장·문제 내용이 완전히 가려지는 96% 불투명 커버 (커닝 방지) -->
  <div class="pause-backdrop" aria-hidden="true"></div>

  <main class="modal-stage pause-stage">
    <section class="modal-shell size-sm" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="c-panel">
        <div class="c-inner">
          <!-- 헤더: 닫기 X 버튼 없음 — 계속하기로만 닫힘 -->
          <header class="modal-header">
            <h1 class="modal-title" id="pause-title">
              <i data-icon="hud/pause" data-size="20"></i>
              <span>일시정지</span>
            </h1>
            <span class="tag">전장 가림</span>
          </header>

          <div class="pause-body">
            <div class="pause-status">
              <span>잠시 멈췄어요.</span>
              <span class="num" style="color: var(--text-muted); font-size: var(--fs-caption);">14웨이브</span>
            </div>

            <button type="button" class="btn btn-primary btn-lg resume-btn">
              <i data-icon="hud/play" data-size="20"></i>
              <span>계속하기</span>
            </button>

            <div class="pause-controls">
              <div class="ctrl-row ctrl-row-stack">
                <div class="ctrl-label-wrap">
                  <span class="ctrl-label">글자 크기</span>
                </div>
                <div class="seg-group" role="radiogroup" aria-label="글자 크기">
                  <button type="button" class="seg-btn is-active" role="radio" aria-checked="true" data-font="base">보통</button>
                  <button type="button" class="seg-btn" role="radio" aria-checked="false" data-font="large">크게</button>
                  <button type="button" class="seg-btn" role="radio" aria-checked="false" data-font="xlarge">아주 크게</button>
                </div>
              </div>

              <hr class="divider" />

              <div class="ctrl-row">
                <div class="ctrl-label-wrap">
                  <span class="ctrl-label">밝은 화면</span>
                  <span class="ctrl-sub">교실 프로젝터용</span>
                </div>
                <button type="button" class="toggle-btn" role="switch" aria-checked="false" aria-label="밝은 화면" id="toggle-light-theme">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </button>
              </div>

              <div class="ctrl-row">
                <div class="ctrl-label-wrap">
                  <span class="ctrl-label">소리</span>
                  <span class="ctrl-sub">효과음 · 알림음</span>
                </div>
                <button type="button" class="toggle-btn" role="switch" aria-checked="true" aria-label="소리" id="toggle-sound">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </button>
              </div>
            </div>

            <hr class="divider" />

            <!-- 하단 이번 판 끝내기 위험 확인 박스 미리보기 -->
            <div class="end-section">
              <div class="end-section-title">이번 판 끝내기</div>
              <div class="c-card is-danger">
                <div class="c-inner danger-box-inner">
                  <div class="danger-msg-row">
                    <span class="danger-icon"><i data-icon="hud/cross" data-size="18"></i></span>
                    <span>이번 판을 끝낼까요? 지금까지의 점수가 기록돼요.</span>
                  </div>
                  <div class="danger-actions">
                    <button type="button" class="btn btn-sm">취소</button>
                    <button type="button" class="btn btn-danger btn-sm">끝내기</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      document.querySelectorAll('[data-font]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('[data-font]').forEach(function (b) {
            b.classList.remove('is-active');
            b.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-checked', 'true');
          document.documentElement.dataset.fontScale = btn.getAttribute('data-font');
        });
      });

      var lightBtn = document.getElementById('toggle-light-theme');
      if (lightBtn) {
        lightBtn.addEventListener('click', function () {
          var next = lightBtn.getAttribute('aria-checked') !== 'true';
          lightBtn.setAttribute('aria-checked', String(next));
          document.documentElement.dataset.theme = next ? 'light' : 'dark';
        });
      }

      var soundBtn = document.getElementById('toggle-sound');
      if (soundBtn) {
        soundBtn.addEventListener('click', function () {
          var next = soundBtn.getAttribute('aria-checked') !== 'true';
          soundBtn.setAttribute('aria-checked', String(next));
        });
      }
    })();
  </script>
</body>
</html>
