<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap');
  :root {
    --bg: #F7F2E4;
    --surface: rgba(247, 242, 228, 0.95);
    --surface-solid: #F7F2E4;
    --surface-muted: #EAE0C8;
    --ink: #1E2430;
    --ink-soft: #4E5663;
    --primary: #E84A38;
    --primary-dark: #A82E20;
    --primary-text: #FFFDF8;
    --secondary: #244B7A;
    --secondary-dark: #173254;
    --accent: #F2B705;
    --accent-dark: #B38300;
    --green: #2F9E8F;
    --green-dark: #1E6E63;
    --border: 2px solid #1E2430;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 4px 0 #1E2430;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .title-font { font-family: 'Gowun Batang', 'Pretendard', serif; letter-spacing: -0.02em; }
  .panel-card {
    background: var(--surface);
    border: var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; font-weight: 800; cursor: pointer;
    border-radius: var(--radius-sm);
    border: 2px solid #1E2430; box-shadow: inset 0 0 0 2px rgba(255,253,248,0.28), 0 4px 0 #1E2430;
    transition: transform 0.08s ease;
  }
  .btn-primary { --btn-edge: var(--primary-dark); background: var(--primary); color: var(--primary-text); }
  .btn-green { --btn-edge: var(--green-dark); background: var(--green); color: #fff; }
  .btn-accent { --btn-edge: var(--accent-dark); background: var(--accent); color: #192231; }
  .btn-surface { --btn-edge: rgba(0,0,0,0.22); background: var(--surface-solid); color: var(--ink); }
  .btn-pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge) !important; }
  .btn-disabled { opacity: 0.45; filter: grayscale(0.4); box-shadow: none !important; }
  .panel-card { box-shadow: inset 0 0 0 2px rgba(242,183,5,0.28), 0 4px 0 #1E2430; }
  .wrap { position: relative; width: 1280px; height: 720px; background: var(--bg); }
  .art { position: absolute; left: 20px; right: 20px; top: 62px; bottom: 102px; background: url('assets/d-monsters-bg.webp') center/contain no-repeat; }
  .header {
    position: absolute; top: 16px; left: 24px; right: 24px; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
  }
  .h-badge {
    padding: 7px 16px; background: var(--surface); border: var(--border);
    border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,0.14);
    display: flex; align-items: center; gap: 10px;
  }
  .h-title { font-size: 20px; font-family: 'Gowun Batang', 'Pretendard', serif; }
  .h-sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .grid-5 {
    position: absolute; left: 24px; right: 24px; bottom: 16px; z-index: 2;
    display: grid; grid-template-columns: 1fr 1fr 1.15fr 1fr 1.35fr; gap: 12px;
  }
  .m-card { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
  .m-role {
    align-self: flex-start; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 900; border: 1.5px solid var(--ink);
  }
  .m-name { font-size: 16px; font-family: 'Gowun Batang', 'Pretendard', serif; }
  .m-stat { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  </style></head><body>
  <div class="wrap">
    <div class="art"></div>
    <div class="header">
      <div class="h-badge">
        <span class="h-title">C3 · 들숲 새참 도적단(acorn_goblin) 5종</span>
        <span class="h-sub">단청 모던 민화</span>
      </div>
      <div class="h-badge"><span class="h-sub">일반 4종 + 5웨이브 보스 1종 · 실루엣/표정 통일</span></div>
    </div>
    <div class="grid-5">
      
        <div class="panel-card m-card">
          <span class="m-role" style="background:var(--surface-muted);">일반 · walker</span>
          <div class="m-name">도토리 보초병</div>
          <div class="m-stat">HP ×1.0 · 속도 ×1.0</div>
        </div>
      
        <div class="panel-card m-card">
          <span class="m-role" style="background:var(--secondary);color:#fff">질주 · runner</span>
          <div class="m-name">새참 날치기꾼</div>
          <div class="m-stat">HP ×0.7 · 속도 ×1.35</div>
        </div>
      
        <div class="panel-card m-card">
          <span class="m-role" style="background:var(--green);color:#fff">거구 · brute</span>
          <div class="m-name">통나무 덩치오우거</div>
          <div class="m-stat">HP ×1.8 · 속도 ×0.75</div>
        </div>
      
        <div class="panel-card m-card">
          <span class="m-role" style="background:var(--accent);">갑각 · shell</span>
          <div class="m-name">냄비뚜껑 갑옷병</div>
          <div class="m-stat">물리 저항 35%</div>
        </div>
      
        <div class="panel-card m-card">
          <span class="m-role" style="background:var(--primary);color:#fff">5웨이브 보스</span>
          <div class="m-name">국자대장 달그락</div>
          <div class="m-stat">HP ×2.1 · 철갑 태세</div>
        </div>
      
    </div>
  </div>
  </body></html>
