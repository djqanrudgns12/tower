<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap');
  :root {
    --bg: #F7F2E4;
    --surface: rgba(247, 242, 228, 0.95);
    --surface-solid: #F7F2E4;
    --surface-muted: #EAE0C8;
    --ink: #1E2430;
    --ink-soft: #4E5663;
    --primary: #E84A38;
    --primary-dark: #A82E20;
    --primary-text: #FFFDF8;
    --secondary: #244B7A;
    --secondary-dark: #173254;
    --accent: #F2B705;
    --accent-dark: #B38300;
    --green: #2F9E8F;
    --green-dark: #1E6E63;
    --border: 2px solid #1E2430;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 4px 0 #1E2430;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .title-font { font-family: 'Gowun Batang', 'Pretendard', serif; letter-spacing: -0.02em; }
  .panel-card {
    background: var(--surface);
    border: var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; font-weight: 800; cursor: pointer;
    border-radius: var(--radius-sm);
    border: 2px solid #1E2430; box-shadow: inset 0 0 0 2px rgba(255,253,248,0.28), 0 4px 0 #1E2430;
    transition: transform 0.08s ease;
  }
  .btn-primary { --btn-edge: var(--primary-dark); background: var(--primary); color: var(--primary-text); }
  .btn-green { --btn-edge: var(--green-dark); background: var(--green); color: #fff; }
  .btn-accent { --btn-edge: var(--accent-dark); background: var(--accent); color: #192231; }
  .btn-surface { --btn-edge: rgba(0,0,0,0.22); background: var(--surface-solid); color: var(--ink); }
  .btn-pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge) !important; }
  .btn-disabled { opacity: 0.45; filter: grayscale(0.4); box-shadow: none !important; }
  .panel-card { box-shadow: inset 0 0 0 2px rgba(242,183,5,0.28), 0 4px 0 #1E2430; }
  .hero { position: relative; width: 1280px; height: 720px; background: url('assets/b-home-bg.webp') center/cover no-repeat; }
  .home-hero-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.62) 64%, rgba(255,255,255,0.88) 100%);
    pointer-events: none;
  }
  .top-bar {
    position: absolute; top: 20px; left: 26px; right: 26px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .profile-chip {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: var(--surface); border: var(--border); border-radius: 999px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.14); font-size: 14px; font-weight: 800;
  }
  .dot-live { width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 1.5px solid var(--ink); }
  .util-row { display: flex; gap: 8px; }
  .util-btn { padding: 9px 15px; font-size: 14px; border-radius: 999px; }

  .right-col {
    position: absolute; top: 82px; right: 32px; bottom: 26px; width: 470px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  }
  .title-block { display: flex; flex-direction: column; gap: 8px; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; padding: 5px 12px; border-radius: 999px;
    background: var(--accent); border: 2px solid var(--ink); font-size: 13px; font-weight: 900; color: #192231;
  }
  .game-title {
    font-size: 46px; line-height: 1.1; color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,0.85);
  }
  .game-sub { font-size: 17px; font-weight: 700; color: var(--ink-soft); }

  .play-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grade-pill {
    padding: 9px 0; text-align: center; font-size: 14px; font-weight: 800;
    border-radius: var(--radius-sm); background: var(--surface-muted); border: 2px solid transparent;
  }
  .grade-pill.active {
    background: var(--secondary); color: #fff; border: 2px solid var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
  }
  .cta-row { display: grid; grid-template-columns: 1.7fr 1fr; gap: 10px; }
  .cta-main { padding: 16px 20px; font-size: 22px; font-family: 'Gowun Batang', 'Pretendard', serif; }
  .cta-sub { padding: 16px 14px; font-size: 16px; }

  .rank-card { padding: 15px 18px; display: flex; flex-direction: column; gap: 9px; }
  .rank-head { display: flex; justify-content: space-between; align-items: center; }
  .rank-title { font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .rank-more { font-size: 13px; font-weight: 800; color: var(--secondary-dark); }
  .rank-list { display: flex; flex-direction: column; gap: 6px; }
  .rank-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 10px; background: var(--surface-solid);
    border: 1.5px solid rgba(0,0,0,0.12); font-size: 14px; font-weight: 700;
  }
  .rank-left { display: flex; align-items: center; gap: 10px; }
  .medal {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 900; font-size: 13px; border: 1.5px solid var(--ink);
  }
  .rank-score { font-family: 'Gowun Batang', 'Pretendard', serif; font-size: 16px; color: var(--primary); }
  </style></head><body>
  <div class="hero">
    <div class="home-hero-scrim"></div>
    <div class="top-bar">
      <div class="profile-chip">
        <span class="dot-live"></span>
        <span>하늘바람 · 서울참나무초</span>
        <span style="color:var(--ink-soft);font-weight:700">| 오늘 1,240명 플레이</span>
      </div>
      <div class="util-row">
        <button class="btn btn-surface util-btn">오답 노트</button>
        <button class="btn btn-surface util-btn">설명서</button>
        <button class="btn btn-surface util-btn">설정</button>
      </div>
    </div>

    <div class="right-col">
      <div class="title-block">
        <span class="eyebrow">초등 3~6학년 어휘 전략</span>
        <h1 class="title-font game-title">어휘력 타워 디펜스</h1>
        <p class="game-sub">낱말을 맞혀 골드를 모으고, 나만의 타워를 키워 성문을 지키세요!</p>
      </div>

      <div class="panel-card play-card">
        <div class="grade-row">
          <div class="grade-pill active">3학년</div>
          <div class="grade-pill">4학년</div>
          <div class="grade-pill">5학년</div>
          <div class="grade-pill">6학년</div>
        </div>
        <div class="cta-row">
          <button class="btn btn-primary cta-main">게임 시작</button>
          <button class="btn btn-surface cta-sub">연습하기</button>
        </div>
      </div>

      <div class="panel-card rank-card">
        <div class="rank-head">
          <span class="rank-title"><svg style="width:18px;height:18px;color:var(--accent-dark)" viewBox="0 0 32 32" fill="none"><path d="M16 3L20 11.5L29 12.8L22.5 19L24 28L16 23.6L8 28L9.5 19L3 12.8L12 11.5L16 3Z" fill="currentColor"/></svg> 3학년 보통 주간 랭킹</span>
          <span class="rank-more">전체 순위 ›</span>
        </div>
        <div class="rank-list">
          <div class="rank-row">
            <div class="rank-left"><span class="medal" style="background:#FFD43B">1</span><span>달빛여우 · 서울참나무초</span></div>
            <span class="rank-score">18,450점</span>
          </div>
          <div class="rank-row">
            <div class="rank-left"><span class="medal" style="background:#E2E8F0">2</span><span>초록바람 · 부산해운초</span></div>
            <span class="rank-score">16,920점</span>
          </div>
          <div class="rank-row">
            <div class="rank-left"><span class="medal" style="background:#F3B47C">3</span><span>별빛고래 · 대전둔산초</span></div>
            <span class="rank-score">15,780점</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  </body></html>
